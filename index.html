    <!-- Instant dark-theme initialization to prevent flash of unstyled content (FOUC) -->
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('theme');
          var isDark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Weave — Discover stories, podcasts, and culture for everyone." />
    <meta name="keywords" content="Weave, podcasts, stories, blogs, culture, audio network" />

    <title>Weave — Stories, Podcasts &amp; Culture</title>
